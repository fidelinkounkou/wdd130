<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>White Water Rafting Company | Contact Us</title>
  <meta name="description" content="Contact White Water Rafting Company in Kolob, California. Send us a message, make a reservation, or ask a question.">
  <meta name="author" content="fideli nkounkou">
  <link rel="stylesheet" href="styles/rafting.css">
</head>
<body>
  <header>
    <img src="images/logo.jpg" alt="Rafting Company Logo" width="100">
    <nav>
      <a href="index.html">Home</a>
      <a href="about.html">About Us</a>
      <a href="trips.html">Trips</a>
      <a href="contact.html">Contact Us</a>
    </nav>
  </header>

  <main>
    <h1>White Water Rafting Company</h1>
    <div class="contact-container">
      <div class="map">
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d6512733.131981885!2d-124.5988976998478!3d37.15161820246821!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x808fb9fe5f285e3d%3A0x8b5109a227086f55!2sCalifornie%2C%20%C3%89tats-Unis!5e0!3m2!1sfr!2scg!4v1785859247920!5m2!1sfr!2scg" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
      </div>
      <div class="form">
        <h2>Send Us a Message</h2>
        <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name">

          <label for="email">Email:</label>
          <input type="email" id="email" name="email">

          <p>Message Purpose:</p>
          <input type="radio" id="general" name="purpose" value="general">
          <label for="general">General Inquiry</label><br>
          <input type="radio" id="reservation" name="purpose" value="reservation">
          <label for="reservation">Reservation Question</label><br>
          <input type="radio" id="website" name="purpose" value="website">
          <label for="website">Website Suggestion</label><br>

          <label for="message">Message:</label>
          <textarea id="message" name="message"></textarea>

          <input type="checkbox" id="newsletter" name="newsletter">
          <label for="newsletter">Please subscribe me to the monthly newsletter</label>

          <button type="submit">Get in Touch!</button>
        </form>
      </div>
    </div>

    <section class="employees">
      <figure>
        <img src="images/employee1.jpg" alt="John Doe - Guide">
        <figcaption>John Doe — Guide</figcaption>
      </figure>
      <figure>
        <img src="images/employee2.jpg" alt="Jane Smith - Manager">
        <figcaption>Jane Smith — Manager</figcaption>
      </figure>
      <figure>
        <img src="images/employee3.webp" alt="Mike Brown - Instructor">
        <figcaption>Mike Brown — Instructor</figcaption>
      </figure>
    </section>
  </main>

  <footer>
    <nav class="socialmedia">
      <a href="https://facebook.com"><img src="images/facebook.webp" alt="Logo Facebook"></a>
      <a href="https://instagram.com"><img src="images/instagram.jpg" alt="Logo Instagram"></a>
      <a href="https://linkedin.com"><img src="images/linkedin.jpg" alt="Logo LinkedIn"></a>
    </nav>
    <p>&copy; 2026 White Water Rafting Company</p>
  </footer>
</body>
</html>
